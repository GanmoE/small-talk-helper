<style>
body {
  font-family: Arial;
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

h1 {
  color: navy;
}

button {
  background-color: lightblue;
  padding: 10px;
  cursor: pointer;
}

button:hover {
  background-color: skyblue;
}
</style>

<h1>Small Talk Helper</h1>

<button onclick="changeTopic()">
Today's Topic
</button>

<p id="topic">What is a good friend?</p>

<h3>Useful Expressions</h3>

<p id="expression">A good friend is someone who...</p>

<script>
function changeTopic() {
  let topics = [
    {
      topic: "What is a good friend?",
      expressions: [
        "A good friend is someone who...",
        "I think a good friend should...",
        "For example, ..."
      ]
    },
    {
      topic: "Is it important to have hobbies?",
      expressions: [
        "I think hobbies are important because...",
        "Hobbies help us...",
        "For example, ..."
      ]
    },
    {
      topic: "Do you enjoy reading books?",
      expressions: [
        "I enjoy reading books because...",
        "My favorite book is...",
        "Reading helps me..."
      ]
    },
    {
      topic: "Should students use smartphones at school?",
      expressions: [
        "I agree because...",
        "I disagree because...",
        "Smartphones can help students..."
      ]
    },
    {
      topic: "Would you like to live abroad?",
      expressions: [
        "I would like to live in...",
        "One reason is...",
        "I could learn..."
      ]
    }
  ];

  let randomNumber = Math.floor(Math.random() * topics.length);
  let selectedTopic = topics[randomNumber];

  document.getElementById("topic").innerHTML =
    selectedTopic.topic;

  document.getElementById("expression").innerHTML =
    selectedTopic.expressions.join("<br>");
}
</script>
